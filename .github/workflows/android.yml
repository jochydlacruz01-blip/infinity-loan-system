name: Android source validation

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Source-only validation: intentionally do not assemble APK or AAB files.
      - name: Run lint and unit tests only
        run: gradle lintDebug testDebugUnitTest
